<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sound Level Meter for HCE</title>
<style>
  :root{
    --bg:#eef1f5; --ink:#0d1b2e; --muted:#5b6b80; --faint:#8a99ab;
    --card:#ffffff; --line:#e3e8ef; --field:#f6f8fa; --fieldLine:#d3dae3;
    --navy:#0d1b2e; --navy2:#1a2d47; --navyLine:#2c4566; --navyText:#9fb3c8;
    --teal:#5eead4; --tealInk:#062a25; --orange:#fb923c; --orangeInk:#2e1300;
    --lead:#0f766e; --stop:#dc2626;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;gap:8px;
    height:100vh;height:100dvh;
    overflow-y:auto;
    -webkit-tap-highlight-color:transparent;
    padding:max(10px, env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px))
            max(8px, env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px));
  }
  button{font-family:inherit;}
  h1{font-size:27px;font-weight:800;margin:2px 0 0;letter-spacing:.2px;flex:none;line-height:1.15;}
  h1 .for{font-size:.5em;font-weight:700;margin-left:5px;letter-spacing:.3px;color:var(--muted);}

  /* navy chart panel */
  .panel{flex:1 1 0;display:flex;flex-direction:column;gap:8px;background:var(--navy);
    border-radius:18px;padding:10px;}
  .plotwrap{position:relative;flex:1 1 0;min-height:34vh;min-height:34dvh;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:10px;}

  .btnRow{display:flex;gap:8px;flex:none;}
  .seg{display:flex;flex:1;gap:3px;}
  .seg button{flex:1;min-width:0;padding:7px 2px;border:1px solid transparent;border-radius:9px;background:var(--navy2);
    color:var(--navyText);font-size:14px;font-weight:700;white-space:nowrap;}
  .seg button.active{background:var(--teal);color:var(--tealInk);}
  .seg.view button.active{background:var(--orange);color:var(--orangeInk);}

  /* bottom row reuses .btnRow/.seg so widths line up with the 4 buttons above */
  .seg .peakbtn{border-color:var(--navyText);background:transparent;color:#ffffff;
    font-variant-numeric:tabular-nums;}
  .seg .peakbtn.hasMarkers{background:#ffffff;color:var(--navy);border-color:#ffffff;}
  .seg .peakbtn.full{opacity:.55;}
  .seg .timerbtn{border-color:var(--navyLine);font-variant-numeric:tabular-nums;}
  .seg .timerbtn.on{border-color:var(--orange);color:var(--orange);}
  .seg .timerbtn:disabled{opacity:1;}

  /* light cards */
  .card{background:var(--card);border-radius:16px;padding:10px 12px;flex:none;
    box-shadow:0 1px 2px rgba(13,27,46,.08);}
  .statsHeader{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px;font-weight:600;}
  .statsGrid{display:grid;grid-template-columns:1fr 1fr 1fr;}
  .stat{text-align:center;}
  .stat + .stat{border-left:1px solid var(--line);}
  .statLabel{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.6px;}
  .statLabel .lower{font-size:.74em;}
  .statValue{font-size:31px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;}
  .statValue small{font-size:13px;font-weight:700;margin-left:2px;color:var(--faint);}
  .stat.lead .statValue{color:var(--lead);}

  .settings{display:flex;flex-direction:column;gap:8px;}
  .setRow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .field{display:flex;align-items:center;gap:7px;}
  .field label{font-size:15px;color:var(--muted);white-space:nowrap;font-weight:600;}
  select{background:var(--field);color:var(--ink);border:1px solid var(--fieldLine);
    border-radius:8px;padding:5px 8px;font-size:17px;font-family:inherit;font-variant-numeric:tabular-nums;}
  .deltaFHint{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}

  .stepper{display:inline-flex;align-items:stretch;border:1px solid var(--fieldLine);border-radius:8px;
    overflow:hidden;background:var(--field);}
  .stepper button{width:32px;border:none;background:#ffffff;color:var(--ink);font-size:19px;font-weight:700;
    line-height:1;padding:0;}
  .stepper button:active{background:var(--line);}
  .stepper input{width:54px;border:none;border-left:1px solid var(--fieldLine);border-right:1px solid var(--fieldLine);
    border-radius:0;background:var(--field);color:var(--ink);font-size:17px;font-family:inherit;text-align:center;
    padding:5px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;}
  .stepper input::-webkit-inner-spin-button,
  .stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}

  .switch{position:relative;display:inline-block;width:44px;height:26px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--fieldLine);border-radius:26px;transition:.15s;}
  .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;
    background:#ffffff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--lead);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  .status{font-size:13px;color:var(--muted);min-height:16px;text-align:center;flex:none;font-variant-numeric:tabular-nums;}
  .status.err{color:var(--stop);}
  .status.ok{color:var(--lead);}

  .startstop{width:100%;padding:14px;border:none;border-radius:14px;font-size:19px;font-weight:800;
    background:var(--navy);color:#ffffff;letter-spacing:.3px;flex:none;}
  .startstop.running{background:var(--stop);}

  .credit{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:10px;color:var(--faint);line-height:1;}
  .logoChip{display:inline-flex;}
  .logoChip img{height:11px;width:auto;display:block;}
</style>
</head>
<body>
  <h1>Sound Level Meter<span class="for">for HCE</span></h1>

  <div class="panel">
    <div class="plotwrap"><canvas id="chart"></canvas></div>
    <div class="btnRow">
      <div class="seg">
        <button id="tabNarrow" class="active">Narrow</button>
        <button id="tabOctave">1/3 Oct.</button>
      </div>
      <div class="seg view">
        <button id="viewInstant" class="active">Time Inst.</button>
        <button id="viewAvg">Time Avg.</button>
      </div>
    </div>
    <div class="btnRow">
      <div class="seg">
        <button id="peakBtn" class="peakbtn">Peak 0/3</button>
        <button id="peakClearBtn">Clear</button>
      </div>
      <div class="seg" id="timerGroup">
        <button id="timerBtn" class="timerbtn">Timer Off</button>
        <button id="timerResetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="statsHeader" id="statsRangeLabel">20 Hz – 4k Hz · A</div>
    <div class="statsGrid">
      <div class="stat lead">
        <div class="statLabel">Leq</div>
        <div class="statValue"><span id="leqValue">--</span><small>dB</small></div>
      </div>
      <div class="stat">
        <div class="statLabel">Lmax</div>
        <div class="statValue"><span id="lmaxValue">--</span><small>dB</small></div>
      </div>
      <div class="stat">
        <div class="statLabel">L<span class="lower">10</span></div>
        <div class="statValue"><span id="l10Value">--</span><small>dB</small></div>
      </div>
    </div>
  </div>

  <div class="card settings">
    <div class="setRow">
      <div class="field">
        <label for="freqRange">Range</label>
        <select id="freqRange">
          <option value="500">20 – 500 Hz</option>
          <option value="1000">20 – 1k Hz</option>
          <option value="4000" selected>20 – 4k Hz</option>
          <option value="10000">20 – 10k Hz</option>
        </select>
      </div>
      <div class="field">
        <label for="aWeight">A Weighting</label>
        <label class="switch">
          <input type="checkbox" id="aWeight" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="setRow">
      <div class="field">
        <label for="calibOffset">Calibration(dB)</label>
        <div class="stepper">
          <button id="calDown" aria-label="Calibration 1 dB down">−</button>
          <input type="number" id="calibOffset" value="120" step="1" inputmode="decimal">
          <button id="calUp" aria-label="Calibration 1 dB up">+</button>
        </div>
      </div>
      <span class="deltaFHint" id="deltaFHint">Δf≈10.8 Hz</span>
    </div>
  </div>

  <div class="status" id="status"></div>
  <button id="startStopBtn" class="startstop">Start</button>
  <footer class="credit">

<script>
(function(){
  "use strict";

  // ---------- constants ----------
  const LOW_FREQ = 20;
  const RANGE_OPTIONS = [500,1000,4000,10000];
  const X_TICK_STEP = { 500: 100, 1000: 200, 4000: 1000, 10000: 2000 };
  const PROC_BUF = 4096;               // ScriptProcessor block size
  const STATS_N = 4096;                // short frames for Leq/Lmax/L10 (≈85 ms window, ≈43 ms hop @48 kHz)

  const THIRD_OCTAVE_CENTERS = [
    20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,
    500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000
  ];
  const BAND_FACTOR = Math.pow(2, 1/6);
  const MAX_PEAKS = 3;
  const ORDINALS = ["1st","2nd","3rd"];
  const TIMER_STEP = 10, TIMER_MAX = 90;

  // level histogram for L10: raw dB (before calibration), 0.1 dB steps
  const HIST_MIN = -200, HIST_STEP = 0.1, HIST_BINS = 2500;

  const C = {
    bg: "#0d1b2e", grid: "#2b4568", gridStrong: "#3d5c85", label: "#c8d6e5", empty: "#9fb3c8",
    inst: "#5eead4", instFill: "rgba(94,234,212,0.13)",
    avg: "#fb923c", avgFill: "rgba(251,146,60,0.15)",
    marker: "#ffffff", tagBg: "#ffffff", tagFg: "#0d1b2e"
  };

  // Range ≤1k Hz → Δf≈1 Hz, 4k/10k Hz → Δf≈10 Hz (FFT size must be a power of two)
  function fftSizeForRange(freq){ return freq <= 1000 ? 32768 : 4096; }

  // ---------- state ----------
  let maxFreq = 4000;
  let FFT_SIZE = fftSizeForRange(maxFreq);
  let mode = "narrow";      // "narrow" | "octave"
  let viewMode = "instant"; // "instant" | "avg"
  let aWeight = true;
  let calibOffset = 120;
  let timerSec = 0;         // 0 = Start/Stop
  let running = false;
  let capturing = false;
  let sampleRate = 44100;
  let samplesDone = 0, targetSamples = Infinity;

  let audioCtx = null, micStream = null, micSource = null, processor = null, silentGain = null;
  let mainFramer = null, statsFramer = null;

  let latestEnergy = null;    // per-bin energy of the latest display frame
  let binCumEnergy, bandCumEnergy, avgCount;   // Time Average accumulators
  let stats;                  // {narrow:[per range], octave:[per range]}
  let peakMarkers = [];       // [{mode, freq, rank}]
  let rafId = null;

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const startStopBtn = $("startStopBtn");
  const statusEl = $("status");
  const tabNarrow = $("tabNarrow");
  const tabOctave = $("tabOctave");
  const viewInstant = $("viewInstant");
  const viewAvg = $("viewAvg");
  const peakBtn = $("peakBtn");
  const timerBtn = $("timerBtn");
  const timerResetBtn = $("timerResetBtn");
  const timerGroup = $("timerGroup");
  const peakClearBtn = $("peakClearBtn");
  const freqRangeSel = $("freqRange");
  const deltaFHint = $("deltaFHint");
  const aWeightChk = $("aWeight");
  const calibInput = $("calibOffset");
  const calDown = $("calDown");
  const calUp = $("calUp");
  const statsRangeLabel = $("statsRangeLabel");
  const leqValue = $("leqValue");
  const lmaxValue = $("lmaxValue");
  const l10Value = $("l10Value");
  const canvas = $("chart");
  const ctx2d = canvas.getContext("2d");

  function setStatus(msg, kind){
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function fmtTime(sec){
    const s = Math.floor(sec);
    return Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0");
  }

  // ---------- accumulators ----------
  function newStat(){ return { sumE: 0, count: 0, maxE: 0, hist: new Uint32Array(HIST_BINS) }; }

  function resetStats(){
    stats = { narrow: RANGE_OPTIONS.map(newStat), octave: RANGE_OPTIONS.map(newStat) };
  }

  function resetAverage(){
    binCumEnergy = new Float64Array(FFT_SIZE/2);
    bandCumEnergy = new Float64Array(THIRD_OCTAVE_CENTERS.length);
    avgCount = 0;
  }

  function addStat(s, e){
    s.sumE += e;
    s.count++;
    if (e > s.maxE) s.maxE = e;
    const db = e > 0 ? 10*Math.log10(e) : HIST_MIN;
    let b = Math.floor((db - HIST_MIN) / HIST_STEP);
    if (b < 0) b = 0; else if (b >= HIST_BINS) b = HIST_BINS - 1;
    s.hist[b]++;
  }

  // L10 = level exceeded 10% of the time (90th percentile of the frame levels)
  function l10Raw(s){
    const above = s.count - Math.ceil(0.9 * s.count);
    let cum = 0;
    for (let b = HIST_BINS - 1; b >= 0; b--){
      cum += s.hist[b];
      if (cum > above) return HIST_MIN + (b + 0.5) * HIST_STEP;
    }
    return null;
  }

  function clearMarkers(){ peakMarkers = []; refreshPeakBtn(); }

  function refreshDeltaFHint(){
    const df = sampleRate / FFT_SIZE;
    deltaFHint.textContent = "Δf≈" + (df < 10 ? df.toFixed(2) : df.toFixed(1)) + " Hz";
  }

  function refreshPeakBtn(){
    const count = peakMarkers.filter(m => m.mode === mode).length;
    peakBtn.textContent = "Peak " + count + "/" + MAX_PEAKS;
    peakBtn.classList.toggle("hasMarkers", count > 0);
    peakBtn.classList.toggle("full", count >= MAX_PEAKS);
  }

  function refreshTimerBtn(){
    timerGroup.style.visibility = viewMode === "avg" ? "visible" : "hidden";
    timerBtn.classList.toggle("on", timerSec > 0);
    timerBtn.disabled = running;
    timerResetBtn.disabled = running;
    if (running && Number.isFinite(targetSamples)){
      const left = Math.max(0, (targetSamples - samplesDone) / sampleRate);
      timerBtn.textContent = "Timer " + Math.ceil(left) + "s";
    } else {
      timerBtn.textContent = timerSec > 0 ? "Timer " + timerSec + "s" : "Timer Off";
    }
  }

  // ---------- DSP ----------
  function fft(re, im){
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++){
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j){
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1){
      const ang = -2*Math.PI/len;
      const wr = Math.cos(ang), wi = Math.sin(ang);
      const half = len >> 1;
      for (let i = 0; i < n; i += len){
        let curR = 1, curI = 0;
        for (let k = 0; k < half; k++){
          const aR = re[i+k], aI = im[i+k];
          const bR = re[i+k+half]*curR - im[i+k+half]*curI;
          const bI = re[i+k+half]*curI + im[i+k+half]*curR;
          re[i+k] = aR + bR; im[i+k] = aI + bI;
          re[i+k+half] = aR - bR; im[i+k+half] = aI - bI;
          const nR = curR*wr - curI*wi;
          const nI = curR*wi + curI*wr;
          curR = nR; curI = nI;
        }
      }
    }
  }

  // A-weighting (IEC 61672), dB correction at f (Hz)
  function aWeightingDb(f){
    if (f <= 0) return -100;
    const f2 = f*f;
    const num = Math.pow(12194,2) * f2 * f2;
    const den = (f2 + 20.6*20.6) * Math.sqrt((f2+107.7*107.7)*(f2+737.9*737.9)) * (f2 + 12194*12194);
    return 20*Math.log10(num/den) + 2.00;
  }

  // Hanning window, 50% overlap framer over the incoming sample stream
  function createFramer(size){
    const win = new Float32Array(size);
    let winSum = 0;
    for (let i = 0; i < size; i++){
      const v = 0.5 - 0.5 * Math.cos((2*Math.PI*i)/(size-1));
      win[i] = v; winSum += v;
    }
    const half = size/2;
    const aGain = new Float64Array(half);
    for (let k = 0; k < half; k++) aGain[k] = Math.pow(10, aWeightingDb(k * sampleRate / size)/10);
    return { size, hop: size/2, ring: new Float32Array(size), since: 0, filled: 0,
             win, winSum, aGain, re: new Float32Array(size), im: new Float32Array(size) };
  }

  // feeds samples in hop-sized chunks so every frame really advances by half a window
  function pushSamples(fr, input, onFrame){
    const len = input.length;
    let pos = 0;
    while (pos < len){
      const take = Math.min(fr.hop - fr.since, len - pos);
      fr.ring.copyWithin(0, take);
      fr.ring.set(input.subarray(pos, pos + take), fr.size - take);
      pos += take;
      fr.since += take;
      fr.filled = Math.min(fr.size, fr.filled + take);
      if (fr.since >= fr.hop){
        fr.since = 0;
        if (fr.filled >= fr.size) onFrame(binEnergies(fr));
      }
    }
  }

  // per-bin energy (squared peak amplitude), A-weighted when enabled
  function binEnergies(fr){
    const n = fr.size, re = fr.re, im = fr.im;
    for (let i = 0; i < n; i++){ re[i] = fr.ring[i] * fr.win[i]; im[i] = 0; }
    fft(re, im);
    const half = n/2;
    const norm2 = (2 / fr.winSum) * (2 / fr.winSum);
    const out = new Float64Array(half);
    for (let k = 1; k < half; k++){
      out[k] = (re[k]*re[k] + im[k]*im[k]) * norm2 * (aWeight ? fr.aGain[k] : 1);
    }
    return out;
  }

  // energy between fa and fb; bin k covers [(k-0.5)df, (k+0.5)df] and contributes by overlap
  function energyBetween(E, df, fa, fb){
    const kStart = Math.max(1, Math.floor(fa/df + 0.5));
    const kEnd = Math.min(E.length - 1, Math.floor(fb/df + 0.5));
    let sum = 0;
    for (let k = kStart; k <= kEnd; k++){
      const lo = Math.max(fa, (k - 0.5) * df);
      const hi = Math.min(fb, (k + 0.5) * df);
      if (hi > lo) sum += E[k] * (hi - lo) / df;
    }
    return sum;
  }

  function onStatsFrame(E){
    const df = sampleRate / STATS_N;
    for (let r = 0; r < RANGE_OPTIONS.length; r++){
      const R = RANGE_OPTIONS[r];
      addStat(stats.narrow[r], energyBetween(E, df, LOW_FREQ, R));
      addStat(stats.octave[r], energyBetween(E, df, LOW_FREQ / BAND_FACTOR, R * BAND_FACTOR));
    }
  }

  function onMainFrame(E){
    latestEnergy = E;
    const df = sampleRate / FFT_SIZE;
    const kMax = Math.min(E.length - 1, Math.ceil(RANGE_OPTIONS[RANGE_OPTIONS.length-1] * BAND_FACTOR / df) + 1);
    for (let k = 1; k <= kMax; k++) binCumEnergy[k] += E[k];
    for (let i = 0; i < THIRD_OCTAVE_CENTERS.length; i++){
      const fc = THIRD_OCTAVE_CENTERS[i];
      bandCumEnergy[i] += energyBetween(E, df, fc / BAND_FACTOR, fc * BAND_FACTOR);
    }
    avgCount++;
  }

  function onAudio(e){
    if (!capturing) return;
    let input = e.inputBuffer.getChannelData(0);
    const room = targetSamples - samplesDone;
    if (input.length > room) input = input.subarray(0, Math.max(0, room));
    if (input.length > 0){
      pushSamples(mainFramer, input, onMainFrame);
      pushSamples(statsFramer, input, onStatsFrame);
      samplesDone += input.length;
    }
    if (samplesDone >= targetSamples){
      capturing = false;
      setTimeout(() => stop("Timer 측정 완료 · " + fmtTime(timerSec), "ok"), 0);
    }
  }

  function applyFftSize(newSize){
    FFT_SIZE = newSize;
    latestEnergy = null;
    resetAverage();
    if (running) mainFramer = createFramer(FFT_SIZE);
    refreshDeltaFHint();
  }

  // ---------- start / stop ----------
  function micIsLive(){
    return !!micStream && micStream.getAudioTracks().some(t => t.readyState === "live");
  }

  // the mic is opened once and kept while the page is visible, so iOS asks for permission only once per visit
  async function ensureAudio(){
    if (audioCtx && audioCtx.state !== "closed" && micIsLive() && processor){
      await audioCtx.resume();
      return;
    }
    releaseAudio();
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    await audioCtx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
    });
    micSource = audioCtx.createMediaStreamSource(micStream);
    processor = audioCtx.createScriptProcessor(PROC_BUF, 1, 1);
    processor.onaudioprocess = onAudio;
    silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    micSource.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioCtx.destination);
  }

  function releaseAudio(){
    try{
      if (processor){ processor.disconnect(); processor.onaudioprocess = null; }
      if (silentGain) silentGain.disconnect();
      if (micSource) micSource.disconnect();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx && audioCtx.state !== "closed") audioCtx.close();
    } catch(e){ /* ignore */ }
    processor = null; silentGain = null; micSource = null; micStream = null; audioCtx = null;
  }

  async function start(){
    try{
      await ensureAudio();
      sampleRate = audioCtx.sampleRate;

      mainFramer = createFramer(FFT_SIZE);
      statsFramer = createFramer(STATS_N);
      latestEnergy = null;
      resetStats();
      resetAverage();
      clearMarkers();
      refreshDeltaFHint();
      samplesDone = 0;
      // the Timer applies only to Time Avg.; Time Inst. runs until Stop
      targetSamples = (viewMode === "avg" && timerSec > 0) ? Math.round(timerSec * sampleRate) : Infinity;

      running = true;
      capturing = true;
      startStopBtn.textContent = "Stop";
      startStopBtn.classList.add("running");
      refreshTimerBtn();
      scheduleDraw();
    } catch (err){
      console.error(err);
      let msg = "마이크를 시작할 수 없습니다: " + (err && err.message ? err.message : err);
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
        msg += " (HTTPS 또는 localhost 환경이 필요합니다)";
      }
      releaseAudio();
      await stop(msg, "err");
    }
  }

  // pauses analysis only; the mic stays open for the next Start
  async function stop(msg, kind){
    const wasRunning = running;
    running = false;
    capturing = false;
    startStopBtn.textContent = "Start";
    startStopBtn.classList.remove("running");
    if (msg) setStatus(msg, kind);
    else if (wasRunning) setStatus("정지됨 · " + fmtTime(samplesDone / sampleRate));
    refreshTimerBtn();
    scheduleDraw();
  }

  // ---------- what the chart currently shows ----------
  function narrowBinRange(){
    const df = sampleRate / FFT_SIZE;
    const half = FFT_SIZE/2;
    const loIdx = Math.max(1, Math.round(LOW_FREQ / df));
    const hiIdx = Math.min(half - 1, Math.max(loIdx + 1, Math.round(maxFreq / df)));
    return { loIdx, hiIdx, df };
  }

  function visibleOctaveIndices(){
    const idxs = [];
    for (let i = 0; i < THIRD_OCTAVE_CENTERS.length; i++){
      if (THIRD_OCTAVE_CENTERS[i] <= maxFreq) idxs.push(i);
    }
    return idxs;
  }

  function currentSeries(){
    const useAvg = (viewMode === "avg");
    if (useAvg ? avgCount === 0 : !latestEnergy) return null;
    const toDb = (e) => e > 0 ? 10*Math.log10(e) + calibOffset : -160;
    if (mode === "narrow"){
      const { loIdx, hiIdx, df } = narrowBinRange();
      const n = hiIdx - loIdx + 1;
      const vals = new Array(n), freqs = new Array(n);
      for (let i = 0; i < n; i++){
        const k = loIdx + i;
        vals[i] = toDb(useAvg ? binCumEnergy[k] / avgCount : latestEnergy[k]);
        freqs[i] = k * df;
      }
      return { vals, freqs, useAvg };
    }
    const df = sampleRate / FFT_SIZE;
    const idxs = visibleOctaveIndices();
    const vals = idxs.map(i => {
      const fc = THIRD_OCTAVE_CENTERS[i];
      return toDb(useAvg ? bandCumEnergy[i] / avgCount
                         : energyBetween(latestEnergy, df, fc / BAND_FACTOR, fc * BAND_FACTOR));
    });
    return { vals, freqs: idxs.map(i => THIRD_OCTAVE_CENTERS[i]), useAvg };
  }

  function nearestIndex(freqs, f){
    let best = 0;
    for (let i = 1; i < freqs.length; i++){
      if (Math.abs(freqs[i] - f) < Math.abs(freqs[best] - f)) best = i;
    }
    return best;
  }

  // adds the next-highest peak not yet marked (local maxima first)
  function pickNextPeak(){
    const mine = peakMarkers.filter(m => m.mode === mode);
    if (mine.length >= MAX_PEAKS) return;
    const s = currentSeries();
    if (!s) return;
    const v = s.vals, n = v.length;
    const isLocalMax = (i) => (i === 0 || v[i] >= v[i-1]) && (i === n-1 || v[i] > v[i+1]);
    const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => v[b] - v[a]);
    const minSep = mode === "narrow" ? 4 : 0;
    const marked = mine.map(m => nearestIndex(s.freqs, m.freq));
    const free = (i) => marked.every(j => Math.abs(i - j) > minSep);
    let pick = order.find(i => isLocalMax(i) && free(i));
    if (pick === undefined && mode === "octave") pick = order.find(free);
    if (pick === undefined) return;
    peakMarkers.push({ mode, freq: s.freqs[pick], rank: mine.length + 1 });
  }

  function formatFreqLabel(f){
    if (f >= 1000){
      const kv = f/1000;
      return (Number.isInteger(kv) ? kv : kv.toFixed(2).replace(/0$/,"")) + "k Hz";
    }
    return (f < 100 ? f.toFixed(1).replace(/\.0$/,"") : Math.round(f)) + " Hz";
  }

  function tickLabel(f){
    return f >= 1000 ? (f/1000) + "k" : String(f);
  }

  // ---------- drawing ----------
  function dpr(){ return window.devicePixelRatio || 1; }
  function px(cssPx, weight){ return (weight || "") + " " + (cssPx * dpr()).toFixed(1) + "px -apple-system, sans-serif"; }

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(200, Math.round(rect.width * dpr()));
    const h = Math.max(100, Math.round(rect.height * dpr()));
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  }

  // Y axis on multiples of 10 dB with at most 8 intervals
  function yAxis(values){
    let mn = Infinity, mx = -Infinity;
    for (const v of values){
      if (!Number.isFinite(v) || v < -150) continue;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    if (!Number.isFinite(mn)){ mn = 0; mx = 80; }
    let lo = Math.floor((mn - 2) / 10) * 10;
    let hi = Math.ceil((mx + 4) / 10) * 10;
    if (hi - lo < 30){ hi = lo + 30; }
    let step = 10;
    for (const s of [10, 20, 50, 100]){ step = s; if ((hi - lo) / s <= 8) break; }
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    return { lo, hi, step };
  }

  function plotBox(padBCss){
    const w = canvas.width, h = canvas.height, d = dpr();
    const padL = 36*d, padR = 10*d, padT = 10*d, padB = padBCss*d;
    return { w, h, padL, padR, padT, padB, plotW: w-padL-padR, plotH: h-padT-padB };
  }

  function drawGridY(box, ax){
    const { padL, padT, plotW, plotH } = box;
    const d = dpr();
    ctx2d.font = px(13, "600");
    ctx2d.fillStyle = C.label;
    ctx2d.textAlign = "right";
    ctx2d.textBaseline = "middle";
    for (let v = ax.lo; v <= ax.hi + 1e-9; v += ax.step){
      const y = padT + plotH * (1 - (v - ax.lo) / (ax.hi - ax.lo));
      ctx2d.strokeStyle = (v === ax.lo) ? C.gridStrong : C.grid;
      ctx2d.lineWidth = d;
      ctx2d.beginPath();
      ctx2d.moveTo(padL, Math.round(y) + 0.5); ctx2d.lineTo(padL + plotW, Math.round(y) + 0.5);
      ctx2d.stroke();
      ctx2d.fillText(String(v), padL - 5*d, y);
    }
    ctx2d.textBaseline = "alphabetic";
  }

  function drawNarrowXAxis(box, fLo, fHi, df){
    const { padL, padT, plotW, plotH } = box;
    const d = dpr();
    const step = X_TICK_STEP[maxFreq];
    const xOf = (f) => padL + (f - fLo) / (fHi - fLo) * plotW;
    ctx2d.font = px(13, "600");
    ctx2d.fillStyle = C.label;
    ctx2d.textBaseline = "top";
    const ticks = [];
    for (let f = step; f <= fHi + df; f += step) ticks.push(f);
    for (const f of ticks){
      const x = Math.min(padL + plotW, xOf(f));
      ctx2d.strokeStyle = C.grid;
      ctx2d.lineWidth = d;
      ctx2d.beginPath();
      ctx2d.moveTo(Math.round(x) + 0.5, padT); ctx2d.lineTo(Math.round(x) + 0.5, padT + plotH);
      ctx2d.stroke();
      ctx2d.textAlign = (x > padL + plotW - 14*d) ? "right" : "center";
      ctx2d.fillText(tickLabel(f), x, padT + plotH + 5*d);
    }
    if (ticks.length && xOf(ticks[0]) - padL > 30*d){
      ctx2d.textAlign = "left";
      ctx2d.fillText(String(LOW_FREQ), padL, padT + plotH + 5*d);
    }
    ctx2d.textBaseline = "alphabetic";
  }

  function drawPeakMarkers(box, xOf){
    const d = dpr();
    ctx2d.save();
    ctx2d.lineWidth = 1.5*d;
    ctx2d.font = px(13, "bold");
    ctx2d.textAlign = "left";
    ctx2d.textBaseline = "middle";
    for (const m of peakMarkers){
      if (m.mode !== mode) continue;
      const x = xOf(m.freq);
      if (x == null) continue;
      ctx2d.strokeStyle = C.marker;
      ctx2d.setLineDash([5*d, 4*d]);
      ctx2d.beginPath();
      ctx2d.moveTo(x, box.padT);
      ctx2d.lineTo(x, box.padT + box.plotH);
      ctx2d.stroke();
      ctx2d.setLineDash([]);

      const label = ORDINALS[m.rank-1] + " " + formatFreqLabel(m.freq);
      const tw = ctx2d.measureText(label).width;
      const padX = 4*d, bh = 17*d;
      const rightSide = x > box.padL + box.plotW*0.6;
      const bx = rightSide ? x - 4*d - tw - 2*padX : x + 4*d;
      const by = box.padT + (2 + (m.rank-1)*19)*d;
      ctx2d.fillStyle = C.tagBg;
      ctx2d.fillRect(bx, by, tw + 2*padX, bh);
      ctx2d.fillStyle = C.tagFg;
      ctx2d.fillText(label, bx + padX, by + bh/2);
    }
    ctx2d.restore();
  }

  function drawNarrow(s){
    const box = plotBox(24);
    const { padL, padT, plotW, plotH } = box;
    const v = s.vals, n = v.length;
    const fLo = s.freqs[0], fHi = s.freqs[n-1];
    const ax = yAxis(v);
    const xOf = (f) => padL + (f-fLo)/(fHi-fLo)*plotW;
    const yOf = (d) => padT + plotH*(1-Math.min(1,Math.max(0,(d-ax.lo)/(ax.hi-ax.lo))));

    drawNarrowXAxis(box, fLo, fHi, sampleRate / FFT_SIZE);
    drawGridY(box, ax);

    ctx2d.beginPath();
    for (let i=0;i<n;i++){
      const x = xOf(s.freqs[i]), y = yOf(v[i]);
      if (i===0) ctx2d.moveTo(x,y); else ctx2d.lineTo(x,y);
    }
    ctx2d.strokeStyle = s.useAvg ? C.avg : C.inst;
    ctx2d.lineWidth = 1.6*dpr();
    ctx2d.stroke();
    ctx2d.lineTo(padL+plotW, padT+plotH);
    ctx2d.lineTo(padL, padT+plotH);
    ctx2d.closePath();
    ctx2d.fillStyle = s.useAvg ? C.avgFill : C.instFill;
    ctx2d.fill();

    drawPeakMarkers(box, (f) => (f < fLo || f > fHi) ? null : xOf(f));
  }

  function drawOctave(s){
    const box = plotBox(42);
    const { padL, padT, plotW, plotH } = box;
    const d = dpr();
    const v = s.vals, nBands = v.length;
    const ax = yAxis(v);
    drawGridY(box, ax);

    const slot = plotW/nBands;
    const gap = slot*0.2;
    const bw = slot - gap;
    const labelEvery = slot < 11*d ? 2 : 1;

    for (let b=0;b<nBands;b++){
      const x0 = padL + b*slot + gap/2;
      const yTop = padT + plotH*(1-Math.min(1,Math.max(0,(v[b]-ax.lo)/(ax.hi-ax.lo))));
      ctx2d.fillStyle = s.useAvg ? C.avg : C.inst;
      ctx2d.fillRect(x0, yTop, bw, padT+plotH-yTop);
    }

    // vertical band labels
    ctx2d.font = px(12, "600");
    ctx2d.fillStyle = C.label;
    ctx2d.textAlign = "right";
    ctx2d.textBaseline = "middle";
    for (let b=0;b<nBands;b++){
      if (b % labelEvery !== 0) continue;
      ctx2d.save();
      ctx2d.translate(padL + b*slot + slot/2, padT + plotH + 5*d);
      ctx2d.rotate(-Math.PI/2);
      ctx2d.fillText(tickLabel(s.freqs[b]), 0, 0);
      ctx2d.restore();
    }
    ctx2d.textBaseline = "alphabetic";

    drawPeakMarkers(box, (f) => {
      const p = s.freqs.indexOf(f);
      return p < 0 ? null : padL + p*slot + slot/2;
    });
  }

  function drawEmpty(msg){
    ctx2d.fillStyle = C.empty;
    ctx2d.font = px(16, "500");
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    ctx2d.fillText(msg, canvas.width/2, canvas.height/2);
    ctx2d.textBaseline = "alphabetic";
  }

  function updateStats(){
    const hiLabel = maxFreq>=1000 ? (maxFreq/1000)+"k" : maxFreq;
    statsRangeLabel.textContent = LOW_FREQ + " Hz – " + hiLabel + " Hz" + (aWeight ? " · A" : "");

    const s = stats[mode][RANGE_OPTIONS.indexOf(maxFreq)];
    if (s.count === 0){
      leqValue.textContent = "--"; lmaxValue.textContent = "--"; l10Value.textContent = "--";
      return;
    }
    const toDb = (e) => e > 0 ? 10*Math.log10(e) + calibOffset : null;
    const leq = toDb(s.sumE / s.count);
    const lmax = toDb(s.maxE);
    const l10r = l10Raw(s);
    const l10 = l10r == null ? null : Math.min(l10r + calibOffset, lmax == null ? Infinity : lmax);
    leqValue.textContent = leq == null ? "--" : leq.toFixed(1);
    lmaxValue.textContent = lmax == null ? "--" : lmax.toFixed(1);
    l10Value.textContent = l10 == null ? "--" : l10.toFixed(1);
  }

  function drawLoop(){
    resizeCanvas();
    ctx2d.fillStyle = C.bg;
    ctx2d.fillRect(0, 0, canvas.width, canvas.height);

    const s = currentSeries();
    if (!s){
      drawEmpty(!running ? "Start를 눌러 측정을 시작하세요"
               : (viewMode === "avg" ? "Time Average 수집 중..." : "데이터 수집 중..."));
    } else if (mode === "narrow"){
      drawNarrow(s);
    } else {
      drawOctave(s);
    }
    updateStats();
    if (running){
      const elapsed = samplesDone / sampleRate;
      setStatus("측정 중 · " + fmtTime(elapsed) + (Number.isFinite(targetSamples) ? " / " + fmtTime(targetSamples / sampleRate) : ""), "ok");
      refreshTimerBtn();
      scheduleDraw();
    }
  }

  function scheduleDraw(){
    if (rafId !== null) return;
    rafId = requestAnimationFrame(() => { rafId = null; drawLoop(); });
  }

  // ---------- UI wiring ----------
  startStopBtn.addEventListener("click", () => { if (!running) start(); else stop(); });

  function setMode(m){
    mode = m;
    tabNarrow.classList.toggle("active", m==="narrow");
    tabOctave.classList.toggle("active", m==="octave");
    refreshPeakBtn();
    scheduleDraw();
  }
  tabNarrow.addEventListener("click", () => setMode("narrow"));
  tabOctave.addEventListener("click", () => setMode("octave"));

  function setViewMode(v){
    viewMode = v;
    if (v === "instant") targetSamples = Infinity;   // switching to Time Inst. cancels a running Timer
    viewInstant.classList.toggle("active", v==="instant");
    viewAvg.classList.toggle("active", v==="avg");
    refreshTimerBtn();
    scheduleDraw();
  }
  viewInstant.addEventListener("click", () => setViewMode("instant"));
  viewAvg.addEventListener("click", () => setViewMode("avg"));

  peakBtn.addEventListener("click", () => {
    pickNextPeak();
    refreshPeakBtn();
    scheduleDraw();
  });
  peakClearBtn.addEventListener("click", () => {
    peakMarkers = peakMarkers.filter(m => m.mode !== mode);
    refreshPeakBtn();
    scheduleDraw();
  });
  // Off → 10 → 20 … → 90 → 10 …
  timerBtn.addEventListener("click", () => {
    if (running) return;
    timerSec = (timerSec === 0 || timerSec >= TIMER_MAX) ? TIMER_STEP : timerSec + TIMER_STEP;
    refreshTimerBtn();
  });
  timerResetBtn.addEventListener("click", () => {
    if (running) return;
    timerSec = TIMER_STEP;
    refreshTimerBtn();
  });

  freqRangeSel.addEventListener("change", () => {
    maxFreq = parseInt(freqRangeSel.value, 10);
    clearMarkers();
    const needed = fftSizeForRange(maxFreq);
    if (needed !== FFT_SIZE) applyFftSize(needed);
    scheduleDraw();
  });
  aWeightChk.addEventListener("change", () => {
    aWeight = aWeightChk.checked;
    latestEnergy = null;
    resetStats();
    resetAverage();
    clearMarkers();
    scheduleDraw();
  });

  function setCalib(v){
    calibOffset = Math.round(v * 10) / 10;
    calibInput.value = calibOffset;
    scheduleDraw();
  }
  calDown.addEventListener("click", () => setCalib(calibOffset - 1));
  calUp.addEventListener("click", () => setCalib(calibOffset + 1));
  calibInput.addEventListener("input", () => {
    const v = parseFloat(calibInput.value);
    if (Number.isFinite(v)){ calibOffset = v; scheduleDraw(); }
  });
  calibInput.addEventListener("blur", () => { calibInput.value = calibOffset; });

  window.addEventListener("resize", scheduleDraw);

  // pause measuring in the background, but keep the mic so returning does not ask again
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) stop();
  });
  window.addEventListener("pagehide", releaseAudio);

  // initial state
  aWeightChk.checked = aWeight;
  resetStats();
  resetAverage();
  refreshDeltaFHint();
  refreshPeakBtn();
  refreshTimerBtn();
  scheduleDraw();
})();
</script>
</body>
</html>
